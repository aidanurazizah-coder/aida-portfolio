<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>TABLE USING COLSPAN, ROWSPAN</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #e0e5e5;
      text-align: center;
      padding: 20px;
    }
    h2 {
      margin-bottom: 20px;
      letter-spacing: 1px;
    }
    table {
      margin: 0 auto;
      border-collapse: collapse;
      background-color: #0b8043;
      color: white;
      font-weight: bold;
      box-shadow: 2px 2px 5px rgba(0,0,0,0.5);
    }
    td {
      border: 2px solid #55a874;
      text-align: center;
      vertical-align: middle;
      padding: 5px;
      min-width: 25px;
      height: 25px;
      box-shadow: inset 1px 1px 2px rgba(255,255,255,0.4), inset -1px -1px 2px rgba(0,0,0,0.4);
    }
  </style>
</head>
<body>

  <h2>TABLE USING COLSPAN, ROWSPAN</h2>

  <table>
    <!-- Baris 1 -->
    <tr>
      <td rowspan="9">A</td>
      <td rowspan="8">B</td>
      <td rowspan="7">C</td>
      <td rowspan="6">D</td>
      <td rowspan="5">E</td>
      <td rowspan="4">F</td>
      <td>AH</td>
      <td rowspan="3">H</td>
      <td rowspan="4">I</td>
      <td rowspan="5">J</td>
      <td rowspan="6">K</td>
      <td rowspan="7">L</td>
      <td rowspan="8">M</td>
    </tr>
    <!-- Baris 2 -->
    <tr>
      <td>H</td>
    </tr>
    <!-- Baris 3 -->
    <tr>
      <td>GH</td>
    </tr>
    <!-- Baris 4 -->
    <tr>
      <td>N</td>
    </tr>
    <!-- Baris 5 -->
    <tr>
      <td colspan="3">O</td>
    </tr>
    <!-- Baris 6 -->
    <tr>
      <td colspan="5">P</td>
    </tr>
    <!-- Baris 7 -->
    <tr>
      <td colspan="7">Q</td>
    </tr>
    <!-- Baris 8 -->
    <tr>
      <td rowspan="2">R</td>
      <td>S</td>
      <td>T</td>
      <td>U</td>
      <td>V</td>
      <td>W</td>
      <td rowspan="2">X</td>
    </tr>
